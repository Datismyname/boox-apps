name: Build Launcher and Reader APKs
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Both APKs
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Boox-Locked-Launcher-APK
          path: launcher/build/outputs/apk/debug/*.apk
      - name: Upload Reader APK
        uses: actions/upload-artifact@v4
        with:
          name: Boox-Locked-Reader-APK
          path: reader/build/outputs/apk/debug/*.apk
